<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian 知识库集成：读取/搜索/创建/编辑笔记、双向链接图谱、Canvas 画布、Dataview 查询、UI 面板可视化浏览，支持加密 Vault 与同步冲突处理</title>
<style>/* obsidian-kb 面板样式：跟随宿主主题（rpc.ts 把 hostContext.theme 写到 <html data-theme>） */
:root {
  color-scheme: dark;
  --bg: #161618;
  --panel: #1d1d21;
  --surface: #26262b;
  --surface-active: #2f2f36;
  --border: #2a2a2e;
  --fg: #e4e4e7;
  --fg-strong: #fafafa;
  --fg-muted: #a1a1aa;
  --fg-subtle: #71717a;
  --fg-faint: #52525b;
  --accent: #f4b04a;
  --accent-soft: rgba(244, 176, 74, 0.12);
  --link: #7da2f0;
  --danger: #f87171;
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff;
  --panel: #f7f7f8;
  --surface: #efeff1;
  --surface-active: #e6e6ea;
  --border: #e2e2e6;
  --fg: #3f3f46;
  --fg-strong: #18181b;
  --fg-muted: #71717a;
  --fg-subtle: #8e8e96;
  --fg-faint: #b3b3ba;
  --accent: #b06f10;
  --accent-soft: rgba(176, 111, 16, 0.12);
  --link: #3b6fd4;
  --danger: #dc2626;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
}

#root { height: 100vh; }

.obsidian-panel {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── 头部 ── */
.panel-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  flex: none;
}

.panel-title {
  flex: 1;
  font-weight: 600;
  font-size: 13px;
  color: var(--fg-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.note-count {
  font-size: 12px;
  color: var(--fg-subtle);
  background: var(--surface);
  border-radius: 999px;
  padding: 2px 10px;
}

/* ── Tab 栏 ── */
.panel-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  flex: none;
}

.panel-tabs button {
  background: transparent;
  border: none;
  color: var(--fg-muted);
  font: inherit;
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
}

.panel-tabs button:hover { background: var(--surface); color: var(--fg); }

.panel-tabs button.active {
  background: var(--surface-active);
  color: var(--accent);
  font-weight: 600;
}

/* ── 主区布局 ── */
.panel-split {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── 文件树 ── */
.file-tree {
  width: 240px;
  flex: none;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 8px 6px;
}

.tree-folder {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  color: var(--fg-muted);
  font-size: 13px;
  cursor: pointer;
  border-radius: 6px;
  user-select: none;
}

.tree-folder:hover { background: var(--surface); }

.file-tree button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  color: var(--fg);
  font: inherit;
  font-size: 13px;
  padding: 4px 8px 4px 24px;
  border-radius: 6px;
  cursor: pointer;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.file-tree button:hover { background: var(--surface); color: var(--accent); }
.file-tree button.active { background: var(--surface-active); color: var(--accent); }
.tree-error { color: var(--danger); padding: 8px; font-size: 12px; }

/* ── 笔记查看 ── */
.note-viewer {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  min-width: 0;
}

.note-title { margin: 0 0 12px; font-size: 20px; color: var(--fg-strong); }
.note-heading { margin: 20px 0 8px; font-size: 15px; color: var(--fg); }
.note-content { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
.note-empty { color: var(--fg-faint); padding: 32px; text-align: center; }
.note-viewer .error { color: var(--danger); }

.frontmatter {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--fg-muted);
  white-space: pre-wrap;
}

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.tag {
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 2px 10px;
}

.wikilink {
  color: var(--link);
  cursor: pointer;
  background: none;
  border: none;
  font: inherit;
  padding: 0;
}

.wikilink:hover { text-decoration: underline; }

.backlinks {
  margin-top: 24px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
  font-size: 12px;
  color: var(--fg-muted);
}

.backlinks .backlink {
  display: block;
  background: none;
  border: none;
  color: var(--link);
  font: inherit;
  font-size: 12px;
  padding: 2px 0;
  cursor: pointer;
  text-align: left;
}

.backlinks .backlink:hover { text-decoration: underline; }

/* ── 图谱 ── */
.graph-view {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  overflow: auto;
}

.graph-view svg { max-width: 100%; height: auto; }

/* ── 搜索 ── */
.search-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 14px 20px;
  min-height: 0;
}

.search-bar {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font: inherit;
  padding: 8px 12px;
  outline: none;
  flex: none;
}

.search-bar:focus { border-color: var(--accent); }

.search-results {
  margin-top: 12px;
  overflow-y: auto;
  flex: 1;
}

.search-result {
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
}

.search-result:hover { background: var(--panel); }

.result-title { display: block; color: var(--fg-strong); font-weight: 600; font-size: 13px; }
.result-path { display: block; color: var(--fg-subtle); font-size: 11px; margin-top: 2px; }
.result-excerpt { display: block; color: var(--fg-muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div id="root"></div>
